name: Compilar APK AVI a MP4
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle assembleRelease --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk AVI-a-MP4.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AVI-a-MP4-APK
          path: AVI-a-MP4.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: avi-mp4-v${{ github.run_number }}
          name: AVI a MP4 (compilación ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: AVI-a-MP4.apk
          body: Descarga AVI-a-MP4.apk e instálalo en el teléfono.
